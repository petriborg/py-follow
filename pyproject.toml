[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-follow"
version = "0.4.0"
description = "Tail (or search) local (or remote) file(s) and colorize the result."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0"}
authors = [{name = "Peter Cooner", email = "petercooner@gmail.com"}]

# Dependencies
dependencies = [
    "types-PyYAML",
    "pyyaml",
    "asyncssh",
]

# Optional dependencies for tests
[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest>8",
    "pytest-cov",
    "requests",
]

# Entry points for console scripts
[project.scripts]
py-follow = "follow.main:main"

[tool.setuptools]
packages = ['follow']
package-dir = {'' = 'src'}

# Pytest configuration (replaces setup.cfg)
[tool.ruff]
line-length = 79
exclude = [".git", "__pycache__"]
# Soft limit: 79 columns, hard limit: 99 (handled by line-length and extra checks)

[tool.mypy]
files = 'src/follow'
exclude = ["test"]
python_version = "3.11"
ignore_missing_imports = false
strict = false

disallow_untyped_defs = true
#disallow_untyped_calls = false
#disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = false

[tool.pytest.ini_options]
minversion = "8.0"
python_files = "test_*.py"
testpaths = ["test"]
